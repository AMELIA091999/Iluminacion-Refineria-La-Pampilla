<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mapa de Luminarias</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <h1>Mapa de Luminarias</h1>

    <div class="tabs">
        <button onclick="mostrarMapa()">Mapa</button>
        <button onclick="mostrarFormulario()">Edición</button>
    </div>

    <div id="contenedorMapa">
        <div id="map"></div>
    </div>

    <div id="contenedorFormulario">

        <h2>Información del Poste</h2>

        <label>Código</label>
        <input id="codigo">

        <label>Tipo Poste</label>
        <input id="tipoPoste">

        <label>Tipo Luminaria</label>
        <input id="tipoLuminaria">

        <label>Funcionamiento</label>
        <input id="funcionamiento">

        <label>Tipo de Falla</label>
        <input id="tipoFalla">

        <button>Guardar</button>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="script.js"></script>

</body>

</html>
