<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mapa de Luminarias</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <header class="barra-superior">
        <div class="logo-container">
            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Repsol_2025.svg/1920px-Repsol_2025.svg.png"
                alt="Repsol"
                class="logo-repsol">

            <div class="titulo-container">
                <span class="empresa">REPSOL</span>
                <span class="sistema">Sistema de Gestión de Luminarias</span>
            </div>
        </div>
    </header>
           
        
    <h2 class="titulo-principal">
    Refinería La Pampilla
    </h2>

    <div class="tabs">
    <button onclick="mostrarMapa()">Mapa</button>
    <button onclick="mostrarFormulario()">Edición</button>
    <button onclick="mostrarNuevo()">Nuevo</button>
    <button onclick="mostrarMiUbicacion()">Mi ubicación</button>
    </div>

    <div id="contenedorMapa">

    <div id="panelMapa">
        <div id="map"></div>
    </div>

    <div id="panelInfo">
        <h3>Información de luminaria</h3>

        <p><strong>Código:</strong> <span id="infoCodigo">-</span></p>
        <p><strong>Estado:</strong> <span id="infoEstado">-</span></p>
        <p><strong>Tipo luminaria:</strong> <span id="infoTipo">-</span></p>
        <p><strong>Tipo poste:</strong> <span id="infoPoste">-</span></p>
        <p><strong>Potencia:</strong> <span id="infoPotencia">-</span></p>
        <p><strong>Altura:</strong> <span id="infoAltura">-</span></p>
        <p><strong>Ubicación:</strong> <span id="infoUbicacion">-</span></p>

        <img id="infoFoto"
             style="width:100%; display:none; margin-top:10px;">
    </div>
    </div>
    

    <div id="contenedorFormulario">

        <h2>Información del Poste</h2>

        <label>Código</label>
        <input id="codigo">

        <label>Tipo Poste</label>
        <input id="tipoPoste">

        <label>Tipo Luminaria</label>
        <input id="tipoLuminaria">

        <label>Funcionamiento</label>
        <input id="funcionamiento">

        <label>Tipo de Falla</label>
        <input id="tipoFalla">

        <button>Guardar</button>

    </div>

    <!-- NUEVA SECCIÓN -->

    <div id="contenedorNuevo">
    <h2>Nueva luminaria</h2>

    <label>Código</label>
    <input id="nuevoCodigo">

    <label>Latitud</label>
    <input id="nuevoLatitud">

    <label>Longitud</label>
    <input id="nuevoLongitud">

    <button onclick="activarSeleccionMapa()">
    Seleccionar ubicación en mapa
    </button>

    <label>Estado</label>
    <input id="nuevoEstado">

    <label>Tipo poste</label>
    <input id="nuevoTipoPoste">

    <label>Tipo luminaria</label>
    <input id="nuevoTipoLuminaria">

    <label>Potencia</label>
    <input id="nuevoPotencia">

    <label>Altura</label>
    <input id="nuevoAltura">

    <label>Ubicación</label>
    <input id="nuevoUbicacion">

    <button onclick="guardarNuevoPoste()">
        Guardar
    </button>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>

</html>
