<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mapa de Luminarias</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <header class="barra-superior">
        <div class="logo-container">
            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Repsol_2025.svg/1920px-Repsol_2025.svg.png"
                alt="Repsol"
                class="logo-repsol">

            <div class="titulo-container">
                <span class="empresa">REPSOL</span>
                <span class="sistema">Sistema de Gestión de Luminarias</span>
            </div>
        </div>
    </header>
           
        
    <h2 class="titulo-principal">
    Refinería La Pampilla
    </h2>

    <div class="tabs">
        <button onclick="mostrarMapa()">Mapa</button>
        <button onclick="mostrarFormulario()">Edición</button>
    </div>

    <div id="contenedorMapa">
        <div id="map"></div>
    </div>

    <div id="contenedorFormulario">

        <h2>Información del Poste</h2>

        <label>Código</label>
        <input id="codigo">

        <label>Tipo Poste</label>
        <input id="tipoPoste">

        <label>Tipo Luminaria</label>
        <input id="tipoLuminaria">

        <label>Funcionamiento</label>
        <input id="funcionamiento">

        <label>Tipo de Falla</label>
        <input id="tipoFalla">

        <button>Guardar</button>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>

</html>
